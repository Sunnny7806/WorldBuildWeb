<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body { margin: 0; padding: 0 0 6px 0; background: transparent; font-family: sans-serif; }
    .map-wrapper {
        position: relative;
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        border: 2px solid #374151;
        background: #111827;
        cursor: crosshair;
    }
    .map-image { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
    .pins-layer { position: absolute; inset: 0; pointer-events: none; }
    .map-pin {
        position: absolute;
        transform: translate(-50%, -100%);
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.2s ease;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .map-pin:hover { transform: translate(-50%, -115%) scale(1.25); z-index: 50; }
    .preview-pin { pointer-events: none; z-index: 100; animation: pulse 0.8s infinite alternate; }
    @keyframes pulse {
        from { transform: translate(-50%, -100%) scale(1); }
        to   { transform: translate(-50%, -110%) scale(1.3); }
    }
    .pin-marker { font-size: 26px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.9)); }
    .pin-label {
        background: rgba(17, 24, 39, 0.9);
        color: #f9fafb;
        font-size: 11px;
        font-weight: bold;
        padding: 2px 7px;
        border-radius: 4px;
        border: 1px solid #4b5563;
        white-space: nowrap;
    }
    .preview-pin .pin-label { background: #dc2626; border-color: #fca5a5; }
</style>
</head>
<body>
    <div class="map-wrapper" id="wrap">
        <img class="map-image" id="img" />
        <div class="pins-layer" id="pins"></div>
    </div>

<script>
    // ---- Streamlit ile konuşma (component protokolü) ----
    function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
    }
    function setValue(value) {
        value.ts = Date.now() + Math.random();   // her tıklama benzersiz olsun
        send("streamlit:setComponentValue", { value: value, dataType: "json" });
    }
    function updateHeight() {
        send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
    }

    const wrap = document.getElementById("wrap");
    const img = document.getElementById("img");
    const pinsLayer = document.getElementById("pins");
    let lastImg = null;

    function makePin(icon, label, extraClass) {
        const el = document.createElement("div");
        el.className = "map-pin" + (extraClass ? " " + extraClass : "");
        const marker = document.createElement("div");
        marker.className = "pin-marker";
        marker.textContent = icon;
        const lbl = document.createElement("div");
        lbl.className = "pin-label";
        lbl.textContent = label;
        el.appendChild(marker);
        el.appendChild(lbl);
        return el;
    }

    // ---- Python'dan gelen verilerle haritayı çiz ----
    function render(args) {
        if (args.img !== lastImg) {
            img.src = args.img;
            lastImg = args.img;
        }
        pinsLayer.innerHTML = "";

        (args.pins || []).forEach(function (p) {
            const el = makePin(p.icon, p.label);
            el.style.left = p.x + "%";
            el.style.top = p.y + "%";
            el.title = p.label;
            el.addEventListener("click", function (ev) {
                ev.stopPropagation();   // haritaya tıklama sayılmasın
                setValue({ action: "goto", name: p.name });
            });
            pinsLayer.appendChild(el);
        });

        if (args.preview) {
            const pv = makePin("🎯", "Seçilen Konum", "preview-pin");
            pv.style.left = args.preview[0] + "%";
            pv.style.top = args.preview[1] + "%";
            pinsLayer.appendChild(pv);
        }
        updateHeight();
    }

    // ---- Haritanın boş bir yerine tıklama: yüzdeyi hesapla ----
    wrap.addEventListener("click", function (e) {
        const r = img.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * 100;
        const y = ((e.clientY - r.top) / r.height) * 100;
        if (x < 0 || x > 100 || y < 0 || y > 100) return;
        setValue({ action: "click", x: +x.toFixed(1), y: +y.toFixed(1) });
    });

    img.addEventListener("load", updateHeight);
    new ResizeObserver(updateHeight).observe(document.body);

    window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "streamlit:render") render(e.data.args);
    });

    send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
